[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests users recipes
addopts =
    --reuse-db
    --strict-markers
    --tb=short
markers =
    slow: медленные тесты (>1s), можно исключить через -m "not slow"
    integration: тесты, проверяющие связь между модулями