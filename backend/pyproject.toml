[project]
name = "foodgram-backend"
version = "0.0.0"
description = "Foodgram backend (diploma)"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "django==5.0.14",
    "django-filter>=25.1",
    "djangorestframework==3.17.2",
    "djoser>=2.3.4",
    "drf-extra-fields>=3.7.0",
    "factory-boy==3.3.3",
    "gunicorn==23.0.0",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.10",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "pytest-mock==3.15.1",
    "python-dotenv==1.2.3",
    "sqlparse==0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["."]
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "**/migrations/*",
    ".venv-ruff",
    ".ruff_cache",
    "settings.py"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E203",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["config", "users", "recipes", "tests"]
known-third-party = ["rest_framework"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
